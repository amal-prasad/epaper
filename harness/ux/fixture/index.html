<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नमूना स्क्रीन</title>
<style>
:root{--ink:#1c1b1a;--paper:#fbf8f2;--primary:#0b5cad;--focus:#b45309}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 "Noto Sans Devanagari",Mukta,sans-serif}
main{padding:16px;max-width:640px}
button,a.btn{min-height:48px;min-width:48px;padding:0 16px;font:inherit;border:2px solid var(--ink);background:#fff;border-radius:10px}
button[data-ux="primary"]{background:var(--primary);color:#fff;border-color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[data-ux="toolbar"]{display:flex;gap:8px;margin:16px 0}
.help{display:inline-block;min-height:48px;line-height:48px;padding:0 16px}
</style></head><body><main>
<h1>जनशक्ति उजाला — अंक 8</h1>
<p>4 में से 2 काम पूरे</p>
<div data-ux="toolbar" role="toolbar" aria-label="खबर के औज़ार">
  <button>← कॉलम</button><button>कॉलम →</button><button>आकार</button><button>और</button>
</div>
<button data-ux="primary">पन्ने बनाएँ</button>
<p><a class="help" data-ux="help" href="https://wa.me/910000000000">मदद चाहिए? WhatsApp पर पूछें</a></p>
</main></body></html>
