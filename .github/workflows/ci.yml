# Runs on every push and pull request. Not yet exercised on GitHub: if a step fails for environment reasons, fix the workflow, never the test.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Unit tests (engine invariants, undo fuzz, guardrails)
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: UX and accessibility lint
        run: npm run ux
      - name: Phase 0 parity (fonts + real copy)
        run: |
          cd spike && npm install --no-audit --no-fund && node add-fonts.mjs && cd ..
          npm run harness -- --phase 0
